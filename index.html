- NEVER use em dashes. Keyboard characters only.
- Row format:
  ["Idea name","Cat1, Cat2","What it does","where it lives (+G)","YYYY-MM-DD",3,"Lang1, Lang2"],

Then save the file and open it in the browser.`;
      const PROMPT_FR = `Tu es mon assistant pour remplir ce dashboard HTML (index.html) d'inventaire de mes projets de code.
Lis d'abord le gros commentaire "INSTRUCTIONS POUR CLAUDE" en haut du fichier, puis suis-le.

Mes dossiers de projets : (ex: ~/dev, ~/Bureau/code, D:\\projets)
Mon pseudo GitHub : (ex: mon_pseudo, laisse vide si aucun)

Etapes :
1. Scanne mes dossiers : repere les vrais projets (package.json, index.html, main.py, manage.py,
   pubspec.yaml, composer.json, go.mod, Cargo.toml). Lis un fichier quand le nom est ambigu.
2. Recupere mes depots GitHub (https://api.github.com/users/MON_PSEUDO/repos?per_page=100) et additionne les etoiles.
3. Remplace UNIQUEMENT le tableau "const P = [...]", la variable GHSTARS, et la date du sous-titre.
   Ne touche a rien d'autre.

Regles :
- 1 idee = 1 ligne. Fusionne variantes et versions. Montre la gradation dans "ou ca vit" : proto -> v2 -> final.
- Inclure TOUT, meme un script de 10 lignes.
- Categorie ET langage peuvent etre multiples (virgules). La categorie doit etre une des cles internes.
- Les etoiles (1 a 5) = la charge de travail pour realiser le projet (pas la qualite).
- Marque les projets publies avec le marqueur G dans le champ "ou ca vit".
- JAMAIS de tiret cadratin. Uniquement des caracteres du clavier.
- Format d'une ligne :
  ["Nom","Cat1, Cat2","Ce que ca fait","ou ca vit (+G)","AAAA-MM-JJ",3,"Lang1, Lang2"],

Puis sauvegarde le fichier et ouvre-le dans le navigateur.`;

      const T = {
        en: {
          htmlLang: "en",
          title: "🗂️ CodeShelf: my coded ideas",
          sub: '1 idea = 1 row. Variants grouped (see "Where it lives"). Stars = amount of work to build it. GitHub included (⭐). Click a column to sort.',
          tpl: "🧩 <b>This is a template.</b> The data below is just a <b>sample</b> to show the look. Give this file to Claude with the prompt below and it will fill it with <b>your</b> real projects.",
          promptsum:
            "📋 Perfect prompt to give Claude (click to show and copy)",
          copybtn: "📋 Copy the prompt",
          copied: "✅ Copied!",
          cath: "Ideas by category",
          langh: "Ideas by language",
          searchPh: '🔎 filter (name, keyword, "github"...)',
          allCats: "All categories",
          allLangs: "All languages",
          az: "A→Z",
          dateBtn: "Date ↓",
          effort: "Effort ↓",
          hIdea: "Idea",
          hCat: "Category",
          hLang: "Language",
          hWhat: "What it does",
          hWhere: "Where it lives",
          hDate: "Date",
          hEffort: "Effort",
          cIdeas: "Distinct ideas",
          cCats: "Categories",
          cLangs: "Languages",
          cGh: "Ideas on GitHub",
          cStars: "⭐ GitHub stars (total)",
          cBig: "Big effort (★4-5)",
          radar: (a, b) =>
            `What kind of dev I am: mostly ${a} & ${b} (click to collapse)`,
          foot: (n, t) =>
            `${n} ideas shown of ${t} total. ⭐ GitHub stars: ${GHSTARS}.`,

          prompt: PROMPT_EN,
        },
        fr: {
          htmlLang: "fr",
          title: "🗂️ CodeShelf : mes idées codées",
          sub: '1 idée = 1 ligne. Variantes regroupées (voir "Où ça vit"). Étoiles = charge de travail pour réaliser le projet. GitHub inclus (⭐). Clique une colonne pour trier.',
          tpl: "🧩 <b>Ceci est un template.</b> Les données ci-dessous sont des <b>exemples</b> pour montrer le rendu. Donne ce fichier à Claude avec le prompt ci-dessous et il le remplira avec <b>tes</b> vrais projets.",
          promptsum:
            "📋 Prompt parfait à donner à Claude (clique pour afficher et copier)",
          copybtn: "📋 Copier le prompt",
          copied: "✅ Copié !",
          cath: "Idées par catégorie",
          langh: "Idées par langage",
          searchPh: '🔎 filtrer (nom, mot-clé, "github"...)',
          allCats: "Toutes catégories",
          allLangs: "Tous langages",
          az: "A→Z",
          dateBtn: "Date ↓",
          effort: "Effort ↓",
          hIdea: "Idée",
          hCat: "Catégorie",
          hLang: "Langage",
          hWhat: "Ce que ça fait",
          hWhere: "Où ça vit",
          hDate: "Date",
          hEffort: "Effort",
          cIdeas: "Idées distinctes",
          cCats: "Catégories",
          cLangs: "Langages",
          cGh: "Idées sur GitHub",
          cStars: "⭐ étoiles GitHub (total)",
          cBig: "Gros effort (★4-5)",
          radar: (a, b) =>
            `Quel type de dev je suis : surtout ${a} & ${b} (clique pour replier)`,
          foot: (n, t) =>
            `${n} idées affichées sur ${t} au total. ⭐ étoiles GitHub : ${GHSTARS}.`,
          scripts: "Scripts/Hack",
          prompt: PROMPT_FR,
        },
      };

      function chip(txt, color, emo) {
        const bg = color + "22";
        return `<span class="chip" style="color:${color};background:${bg};border:1px solid ${color}44">${emo ? emo + " " : ""}${txt}</span>`;
      }
      function langsOf(p) {
        return p[6]
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
      }
      function catsOf(p) {
        return p[1]
          .split(",")
          .map((s) => s.trim())
          .filter(Boolean);
      }
      let lang = "en";
      function cn(k) {
        return CATNAME[lang][k] || k;
      }
      function L() {
        return T[lang];
      }

      const total = P.length,
        ghCount = P.filter((p) => /\bGH\b/.test(p[3])).length;

      function renderCards() {
        const t = L();
        document.getElementById("cards").innerHTML = `
 <div class="card"><div class="n">${total}</div><div class="l">${t.cIdeas}</div></div>
 <div class="card"><div class="n">${new Set(P.flatMap(catsOf)).size}</div><div class="l">${t.cCats}</div></div>
 <div class="card"><div class="n">${new Set(P.flatMap(langsOf)).size}</div><div class="l">${t.cLangs}</div></div>
 <div class="card"><div class="n">${ghCount}</div><div class="l">${t.cGh}</div></div>
 <div class="card"><div class="n gh">${GHSTARS}</div><div class="l">${t.cStars}</div></div>
 <div class="card"><div class="n">${P.filter((p) => p[5] >= 4).length}</div><div class="l">${t.cBig}</div></div>`;
      }

      function barChart(el, data, colorMap, nameFn) {
        const mx = Math.max(...data.map((d) => d[1]), 1);
        document.getElementById(el).innerHTML = data
          .map((d) => {
            const c = (colorMap && colorMap[d[0]]) || "#6ea8ff";
            const label = nameFn ? nameFn(d[0]) : d[0];
            return `<div class="bar-row"><div class="cap">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max((d[1] / mx) * 100, 6)}%;background:${c}">${d[1]}</div></div></div>`;
          })
          .join("");
      }
      function renderCharts() {
        const cat = {};
        P.forEach((p) =>
          catsOf(p).forEach((c) => (cat[c] = (cat[c] || 0) + 1)),
        );
        barChart(
          "catChart",
          Object.entries(cat).sort((a, b) => b[1] - a[1]),
          CATC,
          cn,
        );
        const la = {};
        P.forEach((p) => langsOf(p).forEach((l) => (la[l] = (la[l] || 0) + 1)));
        barChart(
          "langChart",
          Object.entries(la).sort((a, b) => b[1] - a[1]),
          LANGC,
        );
      }

      const AXES = [
        ["Web"],
        ["Jeux"],
        ["Trading"],
        ["IA/ML"],
        ["Audio"],
        ["3D"],
        ["Image"],
        ["Mobile"],
        ["Outils"],
        ["Scraping", "Hacking", "Divers"],
      ];
      function renderRadar() {
        const svg = document.getElementById("radar");
        const cx = 240,
          cy = 195,
          R = 140,
          N = AXES.length;
        const vals = AXES.map((a) =>
          P.filter((p) => catsOf(p).some((c) => a.includes(c))).reduce(
            (s, p) => s + p[5],
            0,
          ),
        );
        const labels = AXES.map((a) => (a.length > 1 ? L().scripts : cn(a[0])));
        const mx = Math.max(...vals, 1);
        function pt(i, r) {
          const ang = -Math.PI / 2 + (i * 2 * Math.PI) / N;
          return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
        }
        let s = "";
        for (let g = 1; g <= 4; g++) {
          let ring = "";
          for (let i = 0; i < N; i++) {
            const [x, y] = pt(i, (R * g) / 4);
            ring += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1) + " ";
          }
          s += `<path d="${ring}Z" fill="none" stroke="#2a2f3a" stroke-width="1"/>`;
        }
        for (let i = 0; i < N; i++) {
          const [x, y] = pt(i, R);
          s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a2f3a"/>`;
        }
        let poly = "";
        vals.forEach((v, i) => {
          const [x, y] = pt(i, R * (v / mx || 0));
          poly += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1) + " ";
        });
        s += `<path d="${poly}Z" fill="#6ea8ff33" stroke="#6ea8ff" stroke-width="2"/>`;
        vals.forEach((v, i) => {
          const [x, y] = pt(i, R * (v / mx || 0));
          s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#6ea8ff"/>`;
        });
        labels.forEach((lb, i) => {
          let [x, y] = pt(i, R + 22);
          const anc =
            Math.abs(x - cx) < 10 ? "middle" : x < cx ? "end" : "start";
          s += `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" fill="#9aa3b2" font-size="11" text-anchor="${anc}" dominant-baseline="middle">${lb} (${vals[i]})</text>`;
        });
        svg.innerHTML = s;
        const top = labels
          .map((lb, i) => [lb, vals[i]])
          .sort((a, b) => b[1] - a[1]);
        document.getElementById("radarTitle").textContent = L().radar(
          top[0][0],
          top[1][0],
        );
      }

      const fcat = document.getElementById("fcat"),
        flang = document.getElementById("flang");
      function buildSelects() {
        const cv = fcat.value,
          lv = flang.value,
          t = L();
        fcat.innerHTML = `<option value="">${t.allCats}</option>`;
        [...new Set(P.flatMap(catsOf))]
          .sort((a, b) => cn(a).localeCompare(cn(b)))
          .forEach((c) =>
            fcat.insertAdjacentHTML(
              "beforeend",
              `<option value="${c}">${CATEMO[c] || ""} ${cn(c)}</option>`,
            ),
          );
        flang.innerHTML = `<option value="">${t.allLangs}</option>`;
        [...new Set(P.flatMap(langsOf))]
          .sort()
          .forEach((l) =>
            flang.insertAdjacentHTML(
              "beforeend",
              `<option value="${l}">${LANGEMO[l] || ""} ${l}</option>`,
            ),
          );
        fcat.value = cv;
        flang.value = lv;
      }

      function stars(n) {
        return (
          "★".repeat(n) +
          '<span style="color:#2a2f3a">' +
          "★".repeat(5 - n) +
          "</span>"
        );
      }
      function esc(s) {
        return s.replace(/\bGH\b/g, '<span class="gh">⭐ GitHub</span>');
      }
      function draw(rows) {
        document.getElementById("rows").innerHTML = rows
          .map(
            (p) =>
              `<tr><td class="nm">${p[0]}</td><td>${catsOf(p)
                .map((c) => chip(cn(c), CATC[c] || "#9aa3b2", CATEMO[c]))
                .join(" ")}</td><td>${langsOf(p)
                .map((l) => chip(l, LANGC[l] || "#9aa3b2", LANGEMO[l]))
                .join(
                  " ",
                )}</td><td>${p[2]}</td><td class="where">${esc(p[3])}</td><td class="date">${p[4]}</td><td class="stars" title="${p[5]}/5 effort">${stars(p[5])}</td></tr>`,
          )
          .join("");
      }

      let cur = [...P],
        lastK = 4,
        lastDesc = true;
      function sortBy(k, desc, keep) {
        if (!keep) {
          lastK = k;
          lastDesc = desc;
        }
        cur.sort((a, b) => {
          let r;
          if (k === 5) r = a[5] - b[5];
          else
            r = String(a[k]).localeCompare(String(b[k]), "fr", {
              numeric: true,
            });
          return desc ? -r : r;
        });
        draw(cur);
      }
      function apply() {
        const v = document.getElementById("q").value.toLowerCase(),
          c = fcat.value,
          l = flang.value;
        cur = P.filter(
          (p) =>
            (!c || catsOf(p).includes(c)) &&
            (!l || langsOf(p).includes(l)) &&
            (!v || p.join(" ").toLowerCase().includes(v)),
        );
        sortBy(lastK, lastDesc, true);
        document.getElementById("foot").textContent = L().foot(
          cur.length,
          total,
        );
      }

      function applyLang(l) {
        lang = l;
        const t = L();
        document.documentElement.lang = t.htmlLang;
        document.getElementById("t_title").textContent = t.title;
        document.getElementById("t_sub").textContent = t.sub;
        document.getElementById("t_tpl").innerHTML = t.tpl;
        document.getElementById("t_promptsum").textContent = t.promptsum;
        document.getElementById("t_copybtn").textContent = t.copybtn;
        document.getElementById("promptBox").textContent = t.prompt;
        document.getElementById("t_cath").textContent = t.cath;
        document.getElementById("t_langh").textContent = t.langh;
        document.getElementById("q").placeholder = t.searchPh;
        document.getElementById("t_az").textContent = t.az;
        document.getElementById("t_date").textContent = t.dateBtn;
        document.getElementById("t_effort").textContent = t.effort;
        document.getElementById("t_hidea").textContent = t.hIdea;
        document.getElementById("t_hcat").textContent = t.hCat;
        document.getElementById("t_hlang").textContent = t.hLang;
        document.getElementById("t_hwhat").textContent = t.hWhat;
        document.getElementById("t_hwhere").textContent = t.hWhere;
        document.getElementById("t_hdate").textContent = t.hDate;
        document.getElementById("t_heffort").textContent = t.hEffort;
        document
          .querySelectorAll(".langsw button")
          .forEach((b) => b.classList.toggle("on", b.dataset.l === l));
        renderCards();
        renderCharts();
        renderRadar();
        buildSelects();
        apply();
      }

      function copyPrompt() {
        const txt = document.getElementById("promptBox").textContent;
        navigator.clipboard
          .writeText(txt)
          .then(() => {
            const b = document.getElementById("t_copybtn");
            b.textContent = L().copied;
            setTimeout(() => (b.textContent = L().copybtn), 1500);
          })
          .catch(() => {});
      }

      document.querySelectorAll("#tbl th").forEach((th) =>
        th.addEventListener("click", () => {
          const k = +th.dataset.k;
          const desc = k === lastK ? !lastDesc : k === 4 || k === 5;
          sortBy(k, desc);
        }),
      );
      document.querySelectorAll(".toolbar .btn").forEach((b) =>
        b.addEventListener("click", () => {
          document
            .querySelectorAll(".toolbar .btn")
            .forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          const k = +b.dataset.k;
          sortBy(k, k === 4 || k === 5);
        }),
      );
      document.getElementById("q").addEventListener("input", apply);
      fcat.addEventListener("change", apply);
      flang.addEventListener("change", apply);
      document
        .querySelectorAll(".langsw button")
        .forEach((b) =>
          b.addEventListener("click", () => applyLang(b.dataset.l)),
        );

      applyLang("en");
    </script>
  </body>
